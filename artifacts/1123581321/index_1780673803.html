    color: var(--text);
    font-family: var(--font-sans);
    overflow-x: hidden;
    min-height: 100vh;
  }

  }
  header {
    display: flex;

    justify-content: space-between;
    padding: 8px 20px;

    font-family: var(--font-mono);
    font-size: 0.82rem;

  .logo { font-weight: 700; font-size: 1.1rem; letter-spacing: 2px; color: var(--cyan); }

  .live-text { color: var(--emerald); }
  .badge {

  .badge-emerald { background: rgba(0,255,136,0.15); color: var(--emerald); }

  .badge-purple { background: rgba(180,78,255,0.15); color: var(--purple); }

    display: grid; gap: 12px; padding: 12px;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    grid-template-rows: 420px 380px 420px 220px;

  @media (max-width: 1400px) {
    .grid { grid-template-columns: 1fr 1fr; grid-template-rows: auto; }
    .grid > * { min-height: 320px; }
  }
  @media (max-width: 768px) {
    .grid { grid-template-columns: 1fr; }
    .grid > * { min-height: 280px; }

  .panel {
    background: var(--bg-panel);

    border-radius: 8px;
    padding: 10px 14px;
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;

    display: flex; justify-content: space-between; align-items: center;

    color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px;

  .panel-title { color: var(--text); font-weight: 700; }
  .chart-container { flex:1; width:100%; min-height:0; }

  .col-span-4 { grid-column: span 4; }

  .ai-card {

  .kol-card .name { font-size: 0.7rem; color: var(--text-dim); }

  .toast {

    padding: 10px 16px; border-radius: 4px; z-index: 200; font-family: var(--font-mono); font-size: 0.75rem;

  }

</style>

let paused = false;

function togglePause() {

// clock

// ==================== MODULE 1: HEATMAP ====================
const heatmapDom = document.getElementById('heatmap');
const heatmapChart = echarts.init(heatmapDom, 'dark');
function buildHeatmap() {
  const clusters = narrativeClusters.slice(0,12);
  const buckets = [];
  const now = new Date();
  for (let i=11; i>=0; i--) {
    const d = new Date(now - i*6*3600*1000);
    buckets.push(d.toISOString().slice(5,16).replace('T',' '));
  }
  // simulate velocity data
  const data = [];
  clusters.forEach((c, ci) => {
    for (let bi=0; bi<12; bi++) {
      const vel = Math.round((c.velocity * (0.5 + Math.random()*1.5)) * (0.3 + 0.7*Math.abs(Math.sin(bi*0.8+ci))));
      data.push([bi, ci, vel]);
    }
  });
  const option = {
    tooltip: {backgroundColor:'rgba(0,0,0,0.85)', textStyle:{fontFamily:"JetBrains Mono",fontSize:11}},
    grid: {left:120, right:40, top:10, bottom:30},
    xAxis: { type:'category', data:buckets, axisLabel:{fontSize:9, rotate:30}, splitLine:{show:false} },
    yAxis: { type:'category', data:clusters.map(c=>c.label), axisLabel:{fontSize:10, fontWeight:'bold', width:110, overflow:'truncate'} },
    visualMap: { min:-200, max:450, left:'left', top:'center', text:['+450%','-200%'], inRange:{color:['#1a3a5c','#0d1b2a','#2a1a00','#8b6914','#00a86b','#00f0ff']}, orient:'vertical', textStyle:{color:'#aaa', fontSize:9} },
    series: [{ type:'heatmap', data:data, label:{show:false}, emphasis:{itemStyle:{shadowBlur:10, shadowColor:'rgba(0,240,255,0.6)'}} }]
  };
  heatmapChart.setOption(option);
}
buildHeatmap();

// ==================== MODULE 2: LEADERBOARD ====================
function renderLeaderboard() {
  const sorted = [...narrativeClusters].sort((a,b)=>b.velocity-a.velocity).slice(0,8);
  const lb = document.getElementById('leaderboard');
  lb.innerHTML = sorted.map((c,i)=>{
    let clr = c.velocity>200?'var(--emerald)':(c.velocity>100?'var(--amber)':'var(--text-dim)');
    return `<div class="lb-row">
      <span class="lb-rank">#${i+1}</span>
      <span class="lb-label">${c.label}</span>
      <span class="lb-vel" style="color:${clr}">${c.velocity>0?'+':''}${c.velocity}%</span>
      <div class="lb-bar"><div class="lb-bar-fill" style="width:${Math.min(100,c.momentum)}%; background:${clr}"></div></div>
    </div>`;
  }).join('');
}
renderLeaderboard();

// ==================== MODULE 3: GRAPH ====================

function buildGraph() {
  const nodes = [
    ...narrativeClusters.slice(0,10).map(c=>({id:c.id, name:c.label, symbolSize:Math.max(15,c.momentum*0.65), category:0, itemStyle:{color:c.category==='military'?'var(--red)':c.category==='geopolitical'?'var(--amber)':c.category==='economic'?'var(--emerald)':c.category==='tech'?'var(--cyan)':c.category==='diplomatic'?'#4a90d9':'var(--text-dim)'}})),
    ...entities.slice(0,12).map(e=>({id:e.id, name:e.name, symbolSize:Math.max(10, e.mentions*0.8), category:1, itemStyle:{color:'#999'}})),
    ...KOLs.slice(0,6).map(k=>({id:k.id, name:k.handle, symbolSize:Math.max(8, k.recentSignals*2), category:2, itemStyle:{color:'var(--cyan)', borderColor:'var(--cyan)', borderWidth:1}})),

  const links = [];
  // link clusters to entities
  narrativeClusters.slice(0,10).forEach(c=>{
    c.relatedEntities.slice(0,4).forEach(re=>{
      const entity = entities.find(e=>e.name===re);
      if(entity) links.push({source:c.id, target:entity.id, lineStyle:{color:'rgba(0,240,255,0.25)', curveness:0.2}});
    });
    c.relatedKOLs.slice(0,2).forEach(rk=>{
      const kol = KOLs.find(k=>k.handle===rk);
      if(kol) links.push({source:c.id, target:kol.id, lineStyle:{color:'rgba(255,184,0,0.25)', curveness:0.3}});
    });
  });
  // add some contradictions (dashed red)
  links.push({source:'c1', target:'c4', lineStyle:{color:'var(--red)', type:'dashed', width:2}, label:{show:true, formatter:'contradiction', color:'var(--red)', fontSize:8}});
  links.push({source:'c11', target:'c5', lineStyle:{color:'var(--red)', type:'dashed', width:2}});
  const option = {
    tooltip: {backgroundColor:'rgba(0,0,0,0.85)'},
    series: [{
      type:'graph', layout:'force', roam:true, draggable:true,
      force:{repulsion:500, edgeLength:[80,200], gravity:0.1},
      data:nodes, links:links,
      label:{show:true, fontSize:9, color:'#aaa', fontFamily:'Inter'},
      emphasis:{focus:'adjacency', lineStyle:{width:2}}
    }]
  };
  graphChart.setOption(option);
}
buildGraph();

// ==================== MODULE 4: AI FEED ====================
const aiFeed = document.getElementById('ai-feed');
function renderAIFeed() {
  aiFeed.innerHTML = aiObservations.map(obs => {
    let badgeCls = '';
    if(obs.type==='contradiction') badgeCls='badge-red';
    else if(obs.type==='cluster_emergence'||obs.type==='anomaly') badgeCls='badge-emerald';
    else if(obs.type==='narrative_shift') badgeCls='badge-amber';
    else badgeCls='badge-cyan';
    return `<div class="ai-card ${obs.type==='contradiction'?'critical':''}">
      <div style="display:flex; justify-content:space-between;"><span class="badge ${badgeCls}">${obs.type.toUpperCase()}</span><span class="ts">${obs.ts.slice(11,19)}</span></div>
      <div class="title">${obs.title}</div>
      <div>${obs.content}</div>
    </div>`;
  }).join('');
}
renderAIFeed();

// Simulate new AI observations
let obsIdx = aiObservations.length;
setInterval(() => {
  if(paused) return;
  const types = ['narrative_shift','correlation','anomaly','prediction'];
  const type = types[Math.floor(Math.random()*types.length)];
  const cluster = narrativeClusters[Math.floor(Math.random()*narrativeClusters.length)];
  const obs = {
    id:`a${obsIdx++}`, ts:new Date().toISOString(), type, title:`New ${type} on ${cluster.label}`,
    content:`AI-detected ${type} in ${cluster.label} cluster. Velocity currently ${cluster.velocity}%. Awaiting analyst review.`,
    confidence:Math.floor(60+Math.random()*35), relatedEvents:[]
  };
  aiObservations.unshift(obs);
  if(aiObservations.length>20) aiObservations.pop();
  renderAIFeed();
  // auto-scroll
  aiFeed.scrollTop = 0;
}, 12000);

// ==================== MODULE 5: TIMELINE ====================
const timelineDom = document.getElementById('timeline');
const timelineChart = echarts.init(timelineDom, 'dark');
function buildTimeline() {
  const sortedEvents = events.sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));
  const categories = ['military','geopolitical','economic','tech','diplomatic','domestic'];
  const catColors = {'military':'var(--red)','geopolitical':'var(--amber)','economic':'var(--emerald)','tech':'var(--cyan)','diplomatic':'#4a90d9','domestic':'var(--text-dim)'};
  // group by cluster
  const series = narrativeClusters.slice(0,8).map((c,idx)=>{
    const clusterEvents = sortedEvents.filter(e=>e.clusterId===c.id).map(e=>({
      name:e.title, value:[e.timestamp.slice(0,16).replace('T',' '), c.label],
      itemStyle:{color:catColors[c.category]||'#aaa'}
    }));
    return {type:'scatter', name:c.label, data:clusterEvents, symbol:'diamond', symbolSize:8};
  });
  const option = {
    tooltip:{formatter:p=>`${p.value?.[1]||''}<br/>${p.value?.[0]||''}`},
    grid:{left:130, right:30, top:10, bottom:20},
    xAxis:{type:'time', axisLabel:{fontSize:9}, splitLine:{show:false}},
    yAxis:{type:'category', data:narrativeClusters.slice(0,8).map(c=>c.label), axisLabel:{fontSize:9}},
    series:series,
    legend:{bottom:0, textStyle:{fontSize:9}}
  };
  timelineChart.setOption(option);
}
buildTimeline();

// ==================== MODULE 6: KOL PANEL ====================
function renderKOLs() {
  document.getElementById('kol-panel').innerHTML = KOLs.map(k=>`
    <div class="kol-card">
      <div class="handle">${k.handle}</div>
      <div class="name">${k.displayName}</div>
      <div style="margin-top:6px; font-size:0.65rem; color:var(--text-dim)">${k.category.toUpperCase()}</div>
      <div style="margin-top:4px; display:flex; align-items:center; gap:4px;">
        <span style="color:var(--cyan)">⚡ ${k.recentSignals}</span>
        <span>·</span>
        <span>#${k.narrativeCount} narratives</span>
      </div>
      <div style="margin-top:4px; font-size:0.65rem; background:rgba(0,240,255,0.1); height:3px; border-radius:2px;">
        <div style="width:${k.authority}%; background:var(--cyan); height:100%; border-radius:2px;"></div>
      </div>
      <div style="font-size:0.6rem; color:var(--text-dim); margin-top:2px;">Authority: ${k.authority}</div>
    </div>
  `).join('');
}
renderKOLs();

// ==================== SIMULATED LIVE STREAM ====================
setInterval(() => {
  if(paused) return;
  lastUpdate = Date.now();
  // update velocities randomly for demo
  narrativeClusters.forEach(c => {
    c.velocity = Math.round(c.velocity + (Math.random()-0.5)*30);
    if(c.velocity>500) c.velocity=500;
    if(c.velocity<-100) c.velocity=-100;
    c.momentum = Math.min(100, Math.max(10, c.momentum + (Math.random()-0.5)*8));
  });
  renderLeaderboard();
  buildHeatmap();
  buildTimeline();
  // notify if critical
  if(Math.random()<0.15) {
    const toast = document.createElement('div');
    toast.className='toast';
    toast.innerHTML='<b style="color:var(--red)">⚠ CRITICAL:</b> New signal contradictory to established narrative';
    document.body.appendChild(toast);
    setTimeout(()=>toast.remove(), 4000);
  }
}, 8000);

// ==================== RESPONSIVE RESIZE ====================
window.addEventListener('resize', () => {
  heatmapChart.resize();
  graphChart.resize();
  timelineChart.resize();
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if(e.key===' ') { e.preventDefault(); togglePause(); }
});

// Init clock
document.getElementById('utc-clock').textContent = new Date().toISOString().replace('T',' ').slice(0,19)+' UTC';
</script>
</body>
